<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jawan's EXP</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<!-- figure out how to make these page buttons more attractive, and also how to turn blog into its own page-->

<div class="wrap">
  <header>
    <h1>
      <button class="nv" id="nvE" data-act="go" data-v="exp">EXP</button>
      <button class="nv" id="nvB" data-act="go" data-v="blog">BLOG</button>
    </h1>
    
<div class="hr">
  <span id="status" class="pill">Loading…</span>
  <button class="link" id="lock" data-act="lock"></button>
  <button class="ib" id="gear" data-act="settings" aria-label="Settings">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="8.4" stroke-width="3.2" stroke-dasharray="2.7 2.7"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2.2"/>
    </svg>
  </button>
</div>
  </header>

  <main id="pgExp">
    <section class="stats" id="statsBox">
      <div class="card">
        <b id="totExp">0</b>
        <span id="lblExp">TOTAL EXP</span>
      </div>
      <div class="card">
        <b id="totQ">—</b>
        <span id="lblQ">QUALITY OF LIFE</span>
      </div>
      <div class="card">
        <b id="totN">0</b>
        <span id="lblN">EXPERIENCES</span>
      </div>
    </section>
    <div id="fsum" class="mute" style="margin-top:10px"></div>
    <details class="fs"><summary>Filter &amp; sort<span id="fcount"></span></summary><div id="tags"></div></details>
    <h2>Journal</h2>
    <div id="journal"></div>
  </main>
  <main id="pgBlog" hidden><h2>Blog</h2><div id="blog"></div></main>
  <main id="pgSet" hidden></main>
</div>
<button class="fab" id="fab" data-act="open">+ Log</button>

<div id="modal" class="ov" hidden>
  <div class="modal">
    <h3 id="mh" class="mh"></h3>
    <div class="xe"><div class="two"><div><label>Start</label><input id="s" type="datetime-local"></div><div><label>End</label><input id="e" type="datetime-local"></div></div><div id="exp" class="expv"></div></div>
    <label>Title</label><input id="t" maxlength="80">
    <div id="tf" class="xe"></div>
    <div class="xe"><label>Rating <span id="rv" style="text-transform:none;letter-spacing:0"></span></label><div id="pick" class="pk"></div></div>
    <label id="dl">Description</label><textarea id="d"></textarea>
    <label>Photos</label><div id="ph"></div><input id="fi" type="file" accept="image/*" multiple>
    <label class="chk"><input id="pub" type="checkbox"> Public (anyone visiting your site can see this)</label>
    <div id="err"></div>
    <button class="go" id="go" data-act="save">LOG</button>
    <button class="link" data-act="close" style="display:block;margin:12px auto 0">Cancel</button>
  </div>
</div>
<div id="lb" class="lb" hidden data-act="unzoom"><img alt=""></div>
<div id="toast" class="toast" hidden></div>
<div id="login" class="ov" hidden><div class="modal">
  <h3 class="mh">Owner login</h3>
  <label>Email</label><input id="lemail" type="email" autocomplete="username">
  <label>Password</label><input id="lpass" type="password" autocomplete="current-password">
  <div id="lerr" style="color:#d92d20;font-size:14px;min-height:20px;margin-top:8px"></div>
  <button class="go" data-act="dologin">LOG IN</button>
  <button class="link" data-act="closelogin" style="display:block;margin:12px auto 0">Cancel</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>

<script src="app.js"></script>
</body>
</html>
