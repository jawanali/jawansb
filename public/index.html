<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jawan's EXP</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
<!-- Quill = the text editor for descriptions; its stylesheet must load before ours so ours can restyle it -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<link rel="stylesheet" href="/style.css">

</head>

<body>
<!-- figure out how to make these page buttons more attractive, and also how to turn blog into its own page-->

<!-- Page layout: the board/posts on the left (.stage), everything else in a column on the right (.rail) -->
<div class="wrap">
 <div class="rail">
  <header>
    <h1 class="tabs">
      <a class="nv" id="nvE" href="/exp" data-act="go" data-v="exp">EXP</a>
      <a class="nv" id="nvB" href="/blog" data-act="go" data-v="blog">BLOG</a>
    </h1>
    
<div class="hr">
  <span id="status" class="pill">Loading…</span>
  <button class="link" id="lock" data-act="lock"></button>
  <button class="ib" id="gear" data-act="settings" aria-label="Settings">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="8.4" stroke-width="3.2" stroke-dasharray="2.7 2.7"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2.2"/>
    </svg>
  </button>
</div>
  </header>
  <aside class="side" id="side">
    <section class="stats" id="statsBox">
      <div class="card">
        <b id="totExp">0</b>
        <span id="lblExp">TOTAL EXP</span>
      </div>
      <div class="card">
        <b id="totQ">—</b>
        <span id="lblQ">QUALITY OF LIFE</span>
      </div>
      <div class="card">
        <b id="totN">0</b>
        <span id="lblN">EXPERIENCES</span>
      </div>
    </section>
    <details class="fs" id="fs"><summary>Filter &amp; sort<span id="fcount"></span></summary>
      <div class="fsb"><input id="tq" class="tq" placeholder="Search tags…" autocomplete="off"><div id="tags"></div></div>
    </details>
  </aside>
 </div>
 <div class="stage">
  <main id="pgExp">
   <h2 class="fh">Experiences</h2>
   <div id="journal"></div>
  </main>
  <main id="pgBlog" hidden><h2>Blog</h2><div id="blog"></div></main>
  <main id="pgSet" hidden></main>
 </div>
</div>
<button class="fab" id="fab" data-act="open">+ Log</button>

<div id="modal" class="ov" hidden>
  <div class="modal">
    <h3 id="mh" class="mh"></h3>
    <details class="drf" id="drf" hidden><summary>Drafts <span id="drfN"></span></summary><div id="drafts"></div></details>
    <!-- Each block can be dragged by its ⠿ handle; the order you leave them in is how the post is shown -->
    <div id="secs">
      <div class="sec" data-sec="title"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><label>Title</label><input id="t" maxlength="80"></div>
      <div class="sec xe" data-sec="time"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><div class="two"><div><label>Start</label><input id="s" type="datetime-local"></div><div><label>End</label><input id="e" type="datetime-local"></div></div><div id="exp" class="expv"></div></div>
      <div class="sec xe" data-sec="type"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><div id="tfType"></div></div>
      <div class="sec xe" data-sec="tags"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><div id="tf"></div></div>
      <div class="sec xe" data-sec="rating"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><label>Rating <span id="rv" style="text-transform:none;letter-spacing:0"></span></label><div id="pick" class="pk"></div></div>
      <div class="sec" data-sec="desc"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><label id="dl">Description</label><div id="ed"></div><textarea id="d" hidden></textarea></div>
      <div class="sec" data-sec="photos"><span class="grip" title="Drag to move" aria-hidden="true">⠿</span><label>Photos</label><div id="ph"></div><input id="fi" type="file" accept="image/*" multiple></div>
    </div>
    <!-- which parts of this experience show on its small preview card on the board -->
    <div class="pvs" id="pvs"><label>Preview card shows</label><div id="pvopts" class="pvopts"></div></div>
    <label class="chk"><input id="pub" type="checkbox"> Public (anyone visiting your site can see this)</label>
    <div id="err"></div>
    <div class="btns"><button class="go2" id="sd" data-act="savedraft">SAVE DRAFT</button><button class="go" id="go" data-act="save">LOG</button></div>
    <button class="link" data-act="close" style="display:block;margin:12px auto 0">Cancel</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="login" class="ov" hidden><div class="modal">
  <h3 class="mh">Owner login</h3>
  <label>Email</label><input id="lemail" type="email" autocomplete="username">
  <label>Password</label><input id="lpass" type="password" autocomplete="current-password">
  <div id="lerr" style="color:#d92d20;font-size:14px;min-height:20px;margin-top:8px"></div>
  <button class="go" data-act="dologin">LOG IN</button>
  <button class="link" data-act="closelogin" style="display:block;margin:12px auto 0">Cancel</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>
<!-- Quill: the description editor. DOMPurify: cleans saved formatting before showing it on a post. -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>

<script src="/app.js"></script>
</body>
</html>
